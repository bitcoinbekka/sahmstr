##
## SAHMstr relay — strfry configuration
##
## This is a trimmed, commented config for a small community relay.
## Full reference: https://github.com/hoytech/strfry/blob/master/strfry.conf
##
## Fill in the `info` block (name, description, pubkey, contact) so the relay
## identifies itself. `pubkey` must be your HEX public key, not your npub —
## see the runbook (docs/RELAY.md) for how to get it.
##

# Directory that contains the strfry LMDB database. Inside the container this
# is a mounted volume, so the data survives restarts and upgrades.
db = "/app/strfry-db/"

dbParams {
    maxreaders = 256
    mapsize    = 10737418240   # 10 GB max DB size. Plenty for a small relay.
}

relay {
    # Listen on all interfaces *inside* the container. Caddy is the only thing
    # the outside world talks to; it proxies to this port. 7777 is never
    # exposed publicly (see docker-compose.yml — no `ports:` mapping).
    bind = "0.0.0.0"
    port = 7777

    # Number of worker threads. 1–2 is ample for a community relay.
    numThreads {
        ingester   = 3
        writer     = 1
    }

    # NIP-11 relay information document. Served when a browser / client asks
    # for the relay's metadata. EDIT THESE.
    info {
        name        = "SAHMstr Relay"
        description = "Home relay for SAHMstr — recipes, home-economics contributions, and private family Circle delivery."
        pubkey      = "YOUR_HEX_PUBKEY"
        contact     = "hello@sahmstr.com"
        # NIP-11 optional fields advertising what this relay supports.
        nips        = [1, 9, 11, 17, 40, 42, 59, 65]
    }

    # 128 KB max message. Circle media is uploaded to Blossom, not the relay,
    # so events stay small; this is comfortably large enough.
    maxWebsocketPayloadSize = 131072

    # Keep idle websockets healthy through proxies.
    autoPingSeconds    = 55
    enableTcpKeepalive = true

    # The external wss:// address, required for NIP-42 AUTH to work.
    serviceUrl = "wss://relay.sahmstr.com"

    # --- Write policy -------------------------------------------------------
    # This points strfry at a plugin script that decides which events to
    # accept. Ours implements a simple allowlist (open read, restricted write)
    # plus lets anyone deliver gift-wrapped Circle events. See write-policy.js
    # and docs/RELAY.md.
    writePolicy {
        plugin = "/app/write-policy.js"
    }

    compression {
        enabled       = true
        slidingWindow = true
    }
}
