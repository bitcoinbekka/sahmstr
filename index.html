<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- media-src must allow blob:, since Circle video is decrypted in the
         browser and played back from an object URL rather than a remote URL. -->
    <meta http-equiv="content-security-policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self' https:; font-src 'self'; base-uri 'self'; manifest-src 'self'; connect-src 'self' blob: https: wss:; img-src 'self' data: blob: https:; media-src 'self' blob: https:">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <meta name="theme-color" content="#1b4636">

    <title>SAHMstr — Home Economics for Sovereign Households</title>
    <meta name="description" content="A home economics curriculum, recipe collection and private family sharing for mothers who keep their own money. Built on Nostr and bitcoin.">

    <!-- Open Graph. og:image is deliberately omitted until the site has a
         deployed URL, since it must be absolute to work when shared. -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SAHMstr — Home Economics for Sovereign Households">
    <meta property="og:description" content="A home economics curriculum, recipe collection and private family sharing for mothers who keep their own money. Built on Nostr and bitcoin.">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
