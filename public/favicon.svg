<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SAHMstr">
  <!-- Oatmeal stock -->
  <rect width="64" height="64" rx="8" fill="#f0e8d9"/>
  <!-- Spruce title band, as across the foot of each plate -->
  <rect x="0" y="42" width="64" height="22" fill="#1b4636"/>
  <!-- Goldenrod sun over a burnt sienna roofline: the domestic emblem of the series -->
  <circle cx="32" cy="22" r="10" fill="#dfa016"/>
  <path d="M10 38 L32 18 L54 38 Z" fill="#b24a22"/>
  <path d="M10 38 L32 18 L54 38 Z" fill="none" stroke="#1b4636" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Hearth window -->
  <rect x="28" y="29" width="8" height="9" fill="#f0e8d9"/>
  <!-- Monogram on the band -->
  <text x="32" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="15" font-weight="bold" fill="#f0e8d9" letter-spacing="0.5">S</text>
</svg>
